name: EclecticLightUpdater
options:
  bundleIdPrefix: co.eclecticlightupdater
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: K3T7J454P7
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: "arm64 x86_64"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  EclecticLightUpdater:
    type: application
    platform: macOS
    sources:
      - Sources/EclecticLightUpdater
      - Resources
    settings:
      base:
        PRODUCT_NAME: "Eclectic Light Updater"
        PRODUCT_BUNDLE_IDENTIFIER: co.eclecticlightupdater.app
        MARKETING_VERSION: "1.5"
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Eclectic Light Updater
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
    scheme:
      testTargets: []
      gatherCoverageData: false
